# Карта носителя rpay — единственный слой конфигурации его периметра.
#
# Здесь живёт вся конфигурация периметра: корни, значения адаптеров, пороги и profile_rules. Слоя над картой нет. Секции [mcp.*] запрещены: секреты живут в `.data/config.toml` этого каталога.
#
# Локальный проект станции: внешних трекера, wiki и vcs-хоста у него нет.
# Артефакты каждой интеграции лежат папками в её каталоге — раскладка и
# порядок работы в ./rpay-integrations.md.

[project]
# Корень проекта в файловой системе — канал его опознания: работа в каталоге
# ниже корня подключает эту карту. Каталоги интеграций лежат под ним.
roots = ["."]

[issue_tracker]
# Внешнего трекера нет: источник issue — файл каталога tasks/ интеграции, его
# путь передаёт поручение. Действует локальный режим без сетевых вызовов.
product = "none"

[docs_wiki]
# Внешней wiki нет: пустой product выключает адаптер и spec-discovery в Define.
# Спецификации читаются файлами каталога wiki/ интеграции.
product = ""

# Секция [vcs_host] не объявлена: MR-хоста нет, git-состояние только локальное.

# Профили, подключаемые к работе. Путь вида `profiles/<файл>.md` — от корня
# репозитория правил (технологические профили); путь с `./` — от каталога
# этой карты (проектная проза).
[[profile_rules]]
match = "path:/rpay/integrations/"
profiles = ["./rpay-integrations.md"]

[vcs]
branch_types = ["feature", "bugfix", "hotfix"]
commit_title_format = "<KEY> <прошедшее время>"

[thresholds]
review_wait_seconds = 120
review_timeout_seconds = 600
