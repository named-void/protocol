# Общая карта для работы вне отдельно опознанного проекта.
# Это fallback-периметр, а не слой, смешиваемый с проектными картами.
# Секреты `[mcp.*]` хранятся в `.data/config.toml` этого каталога.

[issue_tracker]
# У общего периметра нет внешнего трекера: постановку передаёт поручение.
product = "none"
key_pattern = "^[A-Za-z][A-Za-z0-9]*-[0-9]+$"

[vcs_host]
product = "gitlab"

[docs_wiki]
# Внешняя wiki общего периметра не определена.
product = ""

[vcs]
branch_types = ["feature", "bugfix", "hotfix"]
commit_title_format = "<KEY> <прошедшее время>"

[sessions]
executors = ["codex", "claude", "kilo", "cursor"]
default_executors = ["codex", "kilo"]

[[reproduction.environments]]
name = "local-worktree"
type = "local-worktree"

[thresholds]
quality_pass_max_files = 2
quality_pass_max_lines = 40
heartbeat_seconds = 120
heartbeat_ping_multiplier = 2
heartbeat_dead_multiplier = 5

[thresholds.retry_limits]
verify_failed = 2
review_cycles = 3
changes_requested = 3
completeness_recheck = 2
