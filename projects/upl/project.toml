# Карта носителя UPL — единственный слой конфигурации его периметра.
#
# Здесь живёт вся конфигурация периметра: корни в файловой системе, префиксы
# ключей задач, значения адаптеров, исполнители, конвейеры, пороги, стенды
# воспроизведения и profile_rules. Слоя над картой нет — отсутствующий ключ
# берёт дефолт у своего потребителя. Секции [mcp.*] запрещены: url и
# http_headers живут в файле секретов `.data/config.toml` этого каталога.

[project]
# Корни проекта в файловой системе. Опознание проекта идёт по ним: работа в
# каталоге ниже корня подключает эту карту. Первый корень — целевой для clone
# отсутствующего репозитория (SB-96: путь до checkout выводится отсюда, а не
# ищется под домашним каталогом).
roots = ["~/_dev/git/obs/upl"]

[issue_tracker]
# Имя секции секретов — продукт адаптера: [mcp.jira] файла секретов периметра.
product = "jira"
hosts = ["jira.getblogger.ru"]
tool_prefix = "jira_"
key_pattern = "^[A-Za-z][A-Za-z0-9]*-[0-9]+$"
my_issues_query = "filter = 10504"
default_fields = "status,labels,issuetype,description,updated,summary,reporter,created,assignee,priority,customfield_10109"

[issue_tracker.fields]
sprint = "customfield_10109"

[docs_wiki]
product = "confluence"
tool_prefix = "confluence_"
spaces = "IT"

# Конфиг-маппинг проект/компонент -> корневые страницы спецификаций
# (источник 3 порядка дискавери, до полнотекстового поиска).
[[docs_wiki.spec_roots]]
match = "project:UPL"
pages = ["https://confluence.getblogger.ru/pages/viewpage.action?pageId=360505"]

# Платформенная модель доступа (роли, /validate, партнёрская модель): раздел
# General Arch и его дочерние страницы. Адреса перенесены из удалённого
# docs/.internal/access-control.md — больше нигде не перечислены.
[[docs_wiki.spec_roots]]
match = "topic:access-control"
pages = [
  "https://confluence.getblogger.ru/pages/viewpage.action?pageId=26774215", # General Arch
  "https://confluence.getblogger.ru/pages/viewpage.action?pageId=26774428", # C4 - Context Diagram
  "https://confluence.getblogger.ru/pages/viewpage.action?pageId=26774431", # C4 - Container Diagram
  "https://confluence.getblogger.ru/pages/viewpage.action?pageId=26774398", # Авторизация (/validate)
  "https://confluence.getblogger.ru/pages/viewpage.action?pageId=26774806", # services/authN_authZ
  "https://confluence.getblogger.ru/pages/viewpage.action?pageId=26774759", # services/users_partners
  "https://confluence.getblogger.ru/pages/viewpage.action?pageId=26774761", # users_partners/user_partners_db
]

[vcs_host]
product = "gitlab"
hosts = ["gitlab.obs.getblogger.ru", "gitlab.services.mts.ru"]

[mreviewer]
rules = ["./upl-review-rules.md"]

[dispatch]
# Префикс ключа задачи -> путь группы проектов в хосте.
key_prefix_map = { UPL = "getblogger/upl" }

# Профили, подключаемые к работе. Путь вида `profiles/<файл>.md` — от корня
# репозитория правил (технологические профили); путь с `./` — от каталога
# этой карты (проектная проза).
[[profile_rules]]
match = "path:/upl/services/"
profiles = [
    "./upl-services.md",
    "profiles/go.md",
    "profiles/postgresql.md",
    "profiles/http-api.md",
]

# Go-библиотеки инфраструктуры (напр. httperrors): без профиля upl-services и
# postgresql, но с общим Go-профилем и http-api для http-ориентированных либ.
[[profile_rules]]
match = "path:/upl/infrastructure/"
profiles = [
    "profiles/go.md",
    "profiles/http-api.md",
]

[vcs]
branch_types = ["feature", "bugfix", "hotfix"]
commit_title_format = "<KEY> <прошедшее время>"

[thresholds]
heartbeat_seconds = 120
heartbeat_ping_multiplier = 2
heartbeat_dead_multiplier = 5
